name: Main Source

on:
  pull_request:
    branches: [main]

jobs:
  develop-only:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as source branch
        if: github.head_ref != 'develop'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Pull requests into main must come from develop (got: $HEAD_REF)"
          exit 1
      - name: Source branch is develop
        if: github.head_ref == 'develop'
        run: echo "Source branch is develop"

  no-claude-coauthor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Claude co-author trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          offending=$(git log --format='%H' "$BASE_SHA..$HEAD_SHA" | while read -r sha; do
            if git log -1 --format='%B' "$sha" | grep -qiE '^co-authored-by:.*(claude|anthropic)'; then
              git log -1 --format='  %h %s' "$sha"
            fi
          done)
          if [ -n "$offending" ]; then
            echo "Commits must not be co-authored by Claude:"
            echo "$offending"
            exit 1
          fi
          echo "No Claude co-author trailers found"
